name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Create env.js from Variables
        run: |
          echo "const ENV = {" > env.js
          echo "  EMAILJS_PUBLIC_KEY: '${{ vars.EMAILJS_PUBLIC_KEY }}'," >> env.js
          echo "  EMAILJS_SERVICE_ID: '${{ vars.EMAILJS_SERVICE_ID }}'," >> env.js
          echo "  EMAILJS_TEMPLATE_ID: '${{ vars.EMAILJS_TEMPLATE_ID }}'" >> env.js
          echo "};" >> env.js
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
